# Local check of the two data images (deploy/bunny/data/tests/tls-check.sh). Test values only,
# generated by the script; nothing here is a real credential. Ports are bound to loopback.
services:
  postgres:
    build:
      context: ..
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${TEST_PG_PASSWORD:?set by tls-check.sh}
      POSTGRES_DB: app
      PG_LISTEN_PORT: "15432"
    ports:
      - "127.0.0.1:${TEST_PG_PORT:-15432}:15432"
    volumes:
      - pgdata:/var/lib/postgresql
  redis:
    build:
      context: ..
      dockerfile: Dockerfile.redis
    environment:
      REDIS_PASSWORD: ${TEST_REDIS_PASSWORD:?set by tls-check.sh}
      REDIS_TLS_PORT: "16379"
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-16379}:16379"
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
