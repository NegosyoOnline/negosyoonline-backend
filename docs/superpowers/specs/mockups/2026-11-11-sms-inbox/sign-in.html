<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sign in | HQ mockup</title>
<!-- MOCKUP ONLY. Static page: it signs no one in and sends nothing. No application code.
     Design: docs/superpowers/specs/2026-11-11-sms-inbox-hq-design.md, sections 20 and 22 (ClickUp z8uq9me128). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="mockup.css">
</head>
<body class="dash-app">
<a class="skip" href="#main">Skip to content</a>
<div class="auth">
  <header class="auth-top dash-chrome">
    <a class="wordmark" href="sign-in.html" aria-label="NegosyoOnline HQ"><svg viewBox="0 0 224 200" aria-hidden="true" focusable="false"><path fill="#FFFFFF" d="M0 0H64L160 103V0H224V200H160L64 97V200H0Z"/><path fill="#C59A3B" d="M64 0L160 103V200L64 97Z"/></svg><span>NegosyoOnline</span></a>
    <div class="top-actions"><span class="chip chip-info">Staff only</span><button type="button" class="icon-btn" data-theme-toggle aria-label="Switch between dark and light theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button></div>
  </header>
  <main class="auth-main" id="main">
    <form class="dash-card form-card auth-card" action="code.html" aria-labelledby="auth-h">
      <h1 id="auth-h">Admin sign-in</h1>
      <p class="dash-copy">Enter your admin email. We will send you a 6-digit code.</p>
      <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" value="sample.staff@example.com"></div>
      <button class="no-btn no-btn-primary" type="submit">Send code</button>
    </form>
    <p class="mock-note"><strong>Mockup.</strong> The Django page "Admin sign-in" as a page of the staff area on Vercel (design section 22.3), with the same words. The code is checked by the backend, never by this page.</p>
  </main>
</div>
<script>
/* Mockup only: the theme button. */
(function () {
  var root = document.documentElement;
  document.querySelectorAll("[data-theme-toggle]").forEach(function (button) {
    button.addEventListener("click", function () {
      var light = root.getAttribute("data-theme") === "light" ||
        (!root.hasAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: light)").matches);
      root.setAttribute("data-theme", light ? "dark" : "light");
    });
  });
})();
</script>
</body>
</html>
