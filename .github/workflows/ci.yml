name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-24.04
    env:
      DJANGO_SECRET_KEY: ci-only-long-randomized-value-5rYxP2nQ8kL7mV4cD9aF1wH6sT3uJ0bE
      DJANGO_DEBUG: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install uv && uv sync --frozen
      - name: Check model migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Run Django system checks
        run: uv run python manage.py check
      - name: Run Django tests
        run: uv run python manage.py test
      - name: Check production configuration
        env:
          DJANGO_DEBUG: "false"
        run: uv run python manage.py check --deploy

  postgres-and-redis:
    name: PostgreSQL and Redis configuration
    runs-on: ubuntu-24.04
    needs: django
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: negosyoonline_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d negosyoonline_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-long-randomized-value-5rYxP2nQ8kL7mV4cD9aF1wH6sT3uJ0bE
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/negosyoonline_ci
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install uv && uv sync --frozen
      - name: Verify PostgreSQL and Redis configuration
        run: uv run python manage.py check
      - name: Run tests against PostgreSQL and Redis
        run: uv run python manage.py test
