name: Bunny production drift check

# Fails (red run, GitHub notification) when Bunny production does not report the `production`
# branch's HEAD commit and no production release run is in progress. Public endpoint only: no
# secrets. It skips cleanly (green) while the repository variable BUNNY_PRODUCTION_URL is unset
# (production does not exist yet) or the `production` branch does not exist.

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  drift:
    name: Bunny production equals production branch
    runs-on: ubuntu-24.04
    steps:
      - name: Compare /healthz/ commit with the production branch
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ vars.BUNNY_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          if [ -z "$URL" ]; then
            echo "BUNNY_PRODUCTION_URL is not set: Bunny production is not configured yet, nothing to compare"
            exit 0
          fi
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/production" --jq .sha 2>/dev/null || true)"
          if [ -z "$head" ]; then
            echo "the production branch does not exist yet, nothing to compare"
            exit 0
          fi
          running="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/bunny-production.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          got="$(curl --silent --max-time 15 "${URL%/}/healthz/" | jq -r '.commit // empty' 2>/dev/null || true)"
          echo "production_branch=${head:0:12} bunny=${got:-unreachable} release_runs_in_progress=$running"
          if [ "$got" = "${head:0:12}" ]; then exit 0; fi
          if [ "$running" -gt 0 ]; then echo "a release is in progress; not drift yet"; exit 0; fi
          echo "DRIFT: Bunny production is not running the production branch's HEAD" >&2
          exit 1
