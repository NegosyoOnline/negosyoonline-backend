name: Bunny production release

# Runs when "Promote to production" completes successfully (workflow_run: a push made with the
# workflow GITHUB_TOKEN does not start push workflows), and on a push to the `production` branch
# (a human or deploy-key push). promote-production.yml fast-forwards `production` from a v*.*.* tag
# on main. It never builds: it deploys the SAME images (by digest) that "Bunny staging
# release" built and deployed for that commit, and fails if staging never ran the commit.
#   plan -> staged (staging run + images exist, migrations listed in the summary)
#        -> (environment `bunny-production` approval by the owner = release + migrations approval)
#        -> update ONLY the api, worker and beat containers -> verify -> roll back on failure.
# A push run and a workflow_run run for the same commit are serialised by `concurrency`; the second
# finds production already serving the commit in `plan` (skip) and stops before another approval.
# Manual dispatch (from the `production` branch only) with `sha` redeploys an earlier release's
# images (rollback or re-run): no migration rollback.
# Runbook: docs/runbooks/bunny-production.md

on:
  workflow_run:
    workflows: ["Promote to production"]
    types: [completed]
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA on the production branch whose staging-built images are redeployed (rollback). Empty = this run's commit."
        required: false
        type: string

permissions:
  contents: read

# One production release at a time; a running deploy is never cancelled mid-way.
concurrency:
  group: bunny-production-release
  cancel-in-progress: false

env:
  # Production deploys the images staging built. There is no production image repository.
  IMAGE_BASE: ghcr.io/${{ github.repository }}-staging

jobs:
  plan:
    name: Plan
    # A promotion that failed or was cancelled deploys nothing.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.p.outputs.sha }}
      mode: ${{ steps.p.outputs.mode }}
      image_repo: ${{ steps.p.outputs.image_repo }}
      skip: ${{ steps.p.outputs.skip }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # workflow_run: the exact promoted commit (the run itself is on main's tip). push/dispatch: the run's commit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: p
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
          INPUT_SHA: ${{ inputs.sha }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PRODUCTION_URL: ${{ vars.BUNNY_PRODUCTION_URL || 'https://api.negosyoonline.com' }}
        run: deploy/bunny/ci/plan-production.sh

  staged:
    name: Staging-built images and migrations
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      api: ${{ steps.d.outputs.api }}
      worker: ${{ steps.d.outputs.worker }}
      beat: ${{ steps.d.outputs.beat }}
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      REPO: ${{ needs.plan.outputs.image_repo }}
      # Read before the gate, so it comes from the repository variable (an environment variable is
      # not available until the approval). Default is the planned production API host.
      PRODUCTION_URL: ${{ vars.BUNNY_PRODUCTION_URL || 'https://api.negosyoonline.com' }}
    steps:
      - name: Check out source (scripts, history)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a successful staging release of this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: deploy/bunny/ci/require-staging-release.sh "$GITHUB_REPOSITORY" "$SHA"
      - name: Log in to GHCR (read only)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Look up the staging-built image digests (no rebuild)
        id: d
        run: |
          echo "### Images that production will run (built and deployed by staging)" >> "$GITHUB_STEP_SUMMARY"
          deploy/bunny/ci/resolve-staging-images.sh "$REPO" "$SHA"
      - name: List the migrations this release would apply
        run: deploy/bunny/ci/list-migrations.sh "$PRODUCTION_URL" "$SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy, migrate, verify
    needs: [plan, staged]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The owner is the only required reviewer of this environment. Approving this job approves the
    # release and the migrations listed in the `staged` job summary.
    environment: bunny-production
    permissions:
      contents: read
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      IMAGE_REPO: ${{ needs.plan.outputs.image_repo }}
      BUNNY_APP_ID: ${{ vars.BUNNY_APP_ID }}
      # The data app (Postgres, Redis). Optional; read only by the guard in bunny-deploy.sh, which refuses to write to it.
      BUNNY_DATA_APP_ID: ${{ vars.BUNNY_DATA_APP_ID }}
      BUNNY_CONTAINER_API: ${{ vars.BUNNY_CONTAINER_API }}
      BUNNY_CONTAINER_WORKER: ${{ vars.BUNNY_CONTAINER_WORKER }}
      BUNNY_CONTAINER_BEAT: ${{ vars.BUNNY_CONTAINER_BEAT }}
      BUNNY_PRODUCTION_URL: ${{ vars.BUNNY_PRODUCTION_URL || 'https://api.negosyoonline.com' }}
      BUNNY_HQ_URL: ${{ vars.BUNNY_HQ_URL }}
    steps:
      - name: Check out source (scripts)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Require configuration
        env:
          KEY_PRESENT: ${{ secrets.BUNNY_API_KEY != '' }}
        run: |
          [ "$KEY_PRESENT" = "true" ] || { echo "secret BUNNY_API_KEY is not set on the bunny-production environment" >&2; exit 1; }
          for v in BUNNY_APP_ID BUNNY_CONTAINER_API BUNNY_CONTAINER_WORKER BUNNY_CONTAINER_BEAT; do
            [ -n "${!v}" ] || { echo "variable $v is not set on the bunny-production environment" >&2; exit 1; }
          done
      - name: Record the images running now (rollback point)
        id: snap
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          deploy/bunny/ci/bunny-deploy.sh snapshot "$RUNNER_TEMP/previous.json"
          cp "$RUNNER_TEMP/previous.json" previous-images.json
          {
            echo "### Previous images (rollback point)"
            jq -r '.[] | "- \(.role): `\(.imageName):\(.imageTag)`"' previous-images.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save rollback point
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bunny-production-previous-images
          path: previous-images.json
          retention-days: 90
      - name: Update the api, worker and beat containers
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          DIG_API: ${{ needs.staged.outputs.api }}
          DIG_WORKER: ${{ needs.staged.outputs.worker }}
          DIG_BEAT: ${{ needs.staged.outputs.beat }}
        # The api container migrates on start (advisory lock); worker and beat wait for a migrated schema.
        run: deploy/bunny/ci/bunny-deploy.sh apply "$SHA" "$DIG_API" "$DIG_WORKER" "$DIG_BEAT"
      - name: Verify the API host (commit, /readyz/ including beat)
        run: deploy/bunny/ci/verify-release.sh "$BUNNY_PRODUCTION_URL" "$SHA" 900
      - name: Verify the HQ API host
        if: env.BUNNY_HQ_URL != ''
        run: deploy/bunny/ci/verify-hq.sh "$BUNNY_HQ_URL" 300
      - name: Roll back the three containers to the previous images
        if: ${{ failure() && steps.snap.outcome == 'success' }}
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        # Images only. Migrations are never rolled back: they must be backward-compatible.
        run: |
          deploy/bunny/ci/bunny-deploy.sh restore "$RUNNER_TEMP/previous.json"
          echo "### ROLLED BACK to the previous images; the production release failed." >> "$GITHUB_STEP_SUMMARY"
          prev="$(jq -r '.[] | select(.role=="api") | .imageTag' "$RUNNER_TEMP/previous.json")"
          deploy/bunny/ci/verify-release.sh "$BUNNY_PRODUCTION_URL" "${prev%-api}" 600 \
            || echo "rollback did not verify; check the Bunny dashboard" >&2
