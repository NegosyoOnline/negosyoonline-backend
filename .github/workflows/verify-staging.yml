name: Verify staging deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes an older one, so an older run never fails
# just because staging already moved on to a later commit.
concurrency:
  group: verify-staging
  cancel-in-progress: true

jobs:
  verify:
    name: Staging reports the merged commit
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Wait for staging to report this commit
        run: scripts/verify_deploy.sh https://api-staging.negosyonline.com/healthz/ "${GITHUB_SHA::12}"
