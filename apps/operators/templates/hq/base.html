<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>{% block title %}{% endblock %} | NegosyoOnline admin</title>
<style>
:root{color-scheme:light;--ink:#14201B;--muted:#55635C;--line:#D9E0DB;--field:#8A968F;--accent:#1F7A5C;--bad:#B3261E}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#F6F8F6;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-wrap:anywhere}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;min-height:60px;padding:8px 16px;background:#FFFFFF;border-bottom:1px solid var(--line)}
.brand{font-weight:600}
.wrap{padding:24px 16px 48px}
.card{max-width:420px;margin:0 auto;padding:24px;background:#FFFFFF;border:1px solid var(--line);border-radius:12px}
.card.wide{max-width:640px}
.card+.card{margin-top:16px}
h1{font-size:1.5rem;line-height:1.25;margin:0 0 8px}
h2{font-size:1.125rem;line-height:1.3;margin:0 0 4px}
p{margin:0 0 16px}
form{margin:0}
.fld{margin:0 0 16px}
.fld label{display:block;font-weight:600;margin:0 0 6px}
.inp{display:block;width:100%;height:48px;padding:0 12px;font:inherit;color:inherit;background:#FFFFFF;border:1px solid var(--field);border-radius:8px}
.inp:focus{outline:3px solid var(--accent);outline-offset:1px}
.inp[aria-invalid="true"]{border-color:var(--bad)}
.hint{color:var(--muted);font-size:.875rem;margin:6px 0 0}
.err{color:var(--bad);font-size:.875rem;font-weight:600;margin:6px 0 0}
.btn{display:block;width:100%;height:48px;padding:0 16px;font:inherit;font-weight:600;color:#FFFFFF;background:var(--accent);border:1px solid var(--accent);border-radius:8px;cursor:pointer}
.btn.ghost{color:var(--accent);background:#FFFFFF}
.btn.sm{width:auto;height:44px}
.lnk,.link-btn{color:var(--accent);text-decoration:underline}
.lnk{display:inline-block;padding:10px 0}
.link-btn{min-height:44px;padding:0;font:inherit;background:none;border:0;cursor:pointer}
.btn:focus-visible,.lnk:focus-visible,.link-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.below{margin:12px 0 0}
.note{margin:0 0 16px;padding:12px;border:1px solid;border-radius:8px}
.note.info{background:#EAF4F0;border-color:#B7D9CC}
.note.warn{background:#FFF4E0;border-color:#E3C27A}
.note.bad{background:#FCECEA;border-color:#E9B4AF}
.rows{list-style:none;margin:12px 0 0;padding:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:4px 16px;padding:12px 0;border-top:1px solid var(--line)}
.row small{display:block;color:var(--muted);font-size:.875rem}
.row time{color:var(--muted);font-size:.875rem;white-space:nowrap}
.status{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin:0 0 8px;font-weight:600}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.875rem;font-weight:600}
.badge.ok{color:#FFFFFF;background:var(--accent)}
.small{margin:0;color:var(--muted);font-size:.875rem}
@media (min-width:820px){.wrap{padding-top:64px}}
@media (max-width:819px){.row{display:block}.row time{white-space:normal}}
</style>
</head>
<body>
<header class="top"><span class="brand">NegosyoOnline admin</span>{% block header_right %}{% endblock %}</header>
<main class="wrap">
{% block main %}{% endblock %}
</main>
</body>
</html>
